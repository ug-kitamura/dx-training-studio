<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#007BC0"/>
  <g stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- mandala edges: center to four courses -->
    <line x1="16" y1="11" x2="16" y2="21"/>
    <line x1="16" y1="16" x2="9" y2="16"/>
    <line x1="16" y1="16" x2="23" y2="16"/>
  </g>
  <g fill="white">
    <!-- course nodes -->
    <circle cx="16" cy="9" r="2.6"/>
    <circle cx="16" cy="23" r="2.6"/>
    <circle cx="7" cy="16" r="2.2"/>
    <circle cx="25" cy="16" r="2.2"/>
  </g>
</svg>
